syntax = "proto3";

package Protocol;

message CS_BuyRequest {
    int32 userSeq = 1;
    int32 shopSeq = 2;
    int32 itemSeq = 3;
    int32 quantity = 4;
}

message CS_SellRequest {
    int32 userSeq = 1;
    int32 shopSeq = 2;
    int64 itemId = 3;
    int32 quantity = 4;
}

message SC_BuyResponse {
    bool success = 1;
}

message SC_SellResponse {
    bool success = 1;
}
