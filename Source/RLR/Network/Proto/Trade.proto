syntax = "proto3";
package Protocol;

message CS_TradeRequest {
    int32 userSeq1 = 1;  // 거래를 요청한 유저
    int32 userSeq2 = 2;  // 거래 상대방 유저
}
message SC_TradeResponse {
    int32 accepted = 1;   // 상대방이 거래를 수락했는지 여부
    int32 userSeq1 = 2;  // 거래 요청자
    int32 userSeq2 = 3;  // 거래 상대방
}

// 아이템 추가 패킷
message CS_AddTradeItem {
    int32 userSeq = 1;    // 아이템을 추가하는 유저
    int64 itemId = 2;     // 추가하는 아이템 ID
    int32 quantity = 3;   // 추가하는 아이템 수량
}

// 아이템 추가에 대한 응답
message SC_AddTradeItemResponse {
    int32 success = 1;     // 아이템 추가 성공 여부
    int32 userSeq = 2;    // 아이템을 추가한 유저
    int64 itemId = 3;     // 추가된 아이템 ID
    int32 quantity = 4;   // 추가된 아이템 수량
}
// 재화 추가 패킷
message CS_AddTradeCurrency {
    int32 userSeq = 1;    // 재화를 추가하는 유저
    int64 amount = 2;     // 추가하는 재화 수량
}

// 재화 추가에 대한 응답
message SC_AddTradeCurrencyResponse {
    int32 success = 1;     // 재화 추가 성공 여부
    int32 userSeq = 2;    // 재화를 추가한 유저
    int64 amount = 3;     // 추가된 재화 수량
}
// 거래 잠금 및 완료 패킷
message CS_LockTrade {
    int32 userSeq = 1;    // 거래를 잠그는 유저
}


// 거래 취소 패킷
message CS_CancelTrade {
    int32 userSeq = 1;    // 거래를 취소하는 유저
}

